<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TURN // HELPER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --panel:#141412; --panel-alt:#1C1C19;
    --white:#F2F1EC; --gray:#8A8A82; --gray-line:#38372F;
    --orange:#FF8F5E; --red:#FF5C5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg);
    background-image:repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color:var(--white); font-family:'Archivo', sans-serif; min-height:100vh; padding:24px 14px 60px;
  }
  .wrap{max-width:600px; margin:0 auto;}
  header{padding:14px 0; margin-bottom:6px; border-bottom:3px solid var(--white);}
  h1{font-family:'Archivo Black', sans-serif; font-size:1.25rem; letter-spacing:0.02em; margin:0 0 6px; text-transform:uppercase;}
  .subtitle{font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--gray); margin:0;}
  .hazard-bar{height:6px; background:repeating-linear-gradient(-45deg, var(--orange) 0 10px, var(--bg) 10px 20px); margin-bottom:20px;}

  .name-row{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .name-row label{font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--gray); text-transform:uppercase; white-space:nowrap;}
  .name-row input{
    flex:1; background:var(--panel); border:1px solid var(--gray-line); color:var(--white);
    padding:9px 10px; font-family:'JetBrains Mono', monospace; font-size:0.88rem;
  }
  .name-row input:focus{outline:none; border-color:var(--orange);}

  .status-bar{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:22px;}
  .status-chip{text-align:center; padding:10px 4px; border:1px solid var(--gray-line); background:var(--panel);}
  .status-chip .lbl{font-family:'JetBrains Mono', monospace; font-size:0.62rem; text-transform:uppercase; color:var(--gray); display:block;}
  .status-chip .state{font-family:'JetBrains Mono', monospace; font-size:0.72rem; margin-top:3px; display:block; font-weight:700;}
  .status-chip.ready{border-color:var(--orange);}
  .status-chip.ready .state{color:var(--orange);}
  .status-chip.used{border-color:var(--red); opacity:0.6;}
  .status-chip.used .state{color:var(--red);}

  .bracket-panel{position:relative; border:1px solid var(--gray-line); background:var(--panel); padding:20px; margin-bottom:16px;}
  .bracket-panel .bl, .bracket-panel .br{content:''; position:absolute; width:14px; height:14px;}
  .bracket-panel .bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--gray); border-left:2px solid var(--gray); }
  .bracket-panel .br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--gray); border-right:2px solid var(--gray); }
  .bracket-panel h2{font-family:'Archivo Black', sans-serif; font-size:1rem; margin:0 0 14px; text-transform:uppercase;}
  .bracket-panel p{font-family:'Archivo', sans-serif; font-size:0.88rem; line-height:1.55; color:var(--gray); margin:0 0 14px;}

  .options{display:flex; flex-direction:column; gap:8px;}
  button.opt{
    display:flex; align-items:center; gap:10px; text-align:left; font-family:'Archivo', sans-serif; font-weight:600;
    font-size:0.92rem; background:var(--bg); color:var(--white); border:1px solid var(--gray-line); padding:12px 14px; cursor:pointer;
  }
  button.opt:hover{border-color:var(--orange);}
  button.opt:disabled{opacity:0.3; cursor:default;}
  button.opt .tag{
    margin-left:auto; font-family:'JetBrains Mono', monospace; font-size:0.62rem; text-transform:uppercase;
    padding:2px 8px; border:1px solid var(--gray-line); color:var(--gray); white-space:nowrap;
  }
  .tag.action{border-color:var(--red); color:var(--red);}
  .tag.bonus{border-color:var(--orange); color:var(--orange);}
  .tag.reaction{border-color:var(--gray); color:var(--gray);}
  .tag.move{border-color:var(--white); color:var(--white);}

  .examples{margin-top:6px; padding-left:18px; color:var(--gray); font-family:'JetBrains Mono', monospace; font-size:0.78rem; line-height:1.7;}

  .back-row{display:flex; justify-content:space-between; margin-top:16px;}
  button.plain{font-family:'Archivo', sans-serif; font-size:0.85rem; background:none; border:1px solid var(--gray-line); color:var(--gray); padding:8px 14px; cursor:pointer;}
  button.plain:hover{color:var(--white); border-color:var(--orange);}
  button.primary{font-family:'Archivo', sans-serif; font-weight:700; font-size:0.85rem; background:var(--orange); border:1px solid var(--orange); color:var(--bg); padding:9px 18px; cursor:pointer; text-transform:uppercase;}
  button.primary:hover{background:var(--white); border-color:var(--white);}
  button.primary:disabled{opacity:0.3; cursor:default;}

  .controls-row{display:flex; justify-content:center; margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Turn // Helper</h1>
    <p class="subtitle">A step-by-step guide for what you can do on your turn.</p>
  </header>
  <div class="hazard-bar"></div>

  <div class="name-row">
    <label>Whose Turn?</label>
    <input type="text" id="pName" value="Your Turn">
  </div>

  <div class="status-bar" id="statusBar"></div>

  <div class="bracket-panel" id="mainPanel"><div class="bl"></div><div class="br"></div></div>

  <div class="controls-row">
    <button class="primary" id="newTurnBtn">Start Next Turn</button>
  </div>
</div>

<script>
let economy = { action:false, bonus:false, reaction:false, move:false };
const MAIN_MENU = 'menu';
let currentView = MAIN_MENU;
let currentDetail = null;

const DETAILS = {
  attack: { uses:'action', title:'Making an Attack', body:"This uses your Action. Roll to hit (d20 + attack bonus) against the target's AC. If it hits, roll your damage dice.", examples:["Swing your weapon at an enemy","Fire a bow or crossbow","Ask your DM if unsure whether it hits"] },
  spell: { uses:'action', title:'Casting a Spell', body:'Most spells use your Action. Check the spell\'s description — if it says "1 action," it uses your Action for the turn.', examples:["Fireball, Magic Missile, Cure Wounds — all Action spells","Only cast as a Bonus Action if the spell text says so"] },
  dash: { uses:'action', title:'Dash / Disengage / Dodge', body:'These are all Actions, not free moves. Dash doubles your movement. Disengage lets you move away safely. Dodge makes attacks against you harder to land.', examples:["Dash: run further than usual","Disengage: back away from melee safely","Dodge: impose disadvantage on attacks against you"] },
  help: { uses:'action', title:'Helping / Searching / Hiding', body:'Helping an ally, searching, or hiding are all Actions unless a class feature says otherwise.', examples:["Help: give an ally advantage","Search: look for hidden things","Hide: attempt to become unseen"] },
  bonus: { uses:'bonus', title:'Using a Bonus Action', body:'You only get a Bonus Action if something specifically grants you one. If nothing says "bonus action," you don\'t have one to use.', examples:["Rogue's Cunning Action","A quickened spell","Off-hand weapon attack"] },
  item: { uses:'action', title:'Using an Item', body:'Using most items takes your Action, unless stated otherwise. Interacting with one simple object is usually free.', examples:["Drink a potion — Action","Draw your sword — free"] },
  move: { uses:'move', title:'Moving', body:'You can move up to your speed, and split it before/after your Action.', examples:["Walk up, then attack","Move away after attacking with leftover speed"] },
  reaction: { uses:'reaction', title:'Reactions', body:'A Reaction can be used once per round, even on someone else\'s turn. It resets at the start of your turn.', examples:["Opportunity attack when an enemy leaves your reach","Casting Shield when hit","Available even during other players' turns"] }
};

function renderStatusBar(){
  const bar = document.getElementById('statusBar');
  const labels = {action:'ACT', bonus:'BNS', reaction:'RXN', move:'MOV'};
  bar.innerHTML = ['action','bonus','reaction','move'].map(key => {
    const used = economy[key];
    return `<div class="status-chip ${used?'used':'ready'}"><span class="lbl">${labels[key]}</span><span class="state">${used?'USED':'READY'}</span></div>`;
  }).join('');
}

function renderMenu(){
  const panel = document.getElementById('mainPanel');
  const name = document.getElementById('pName').value || 'Your';
  panel.innerHTML = `
    <div class="bl"></div><div class="br"></div>
    <h2>What do you want to do, ${escapeHtml(name)}?</h2>
    <div class="options">
      <button class="opt" data-detail="attack" ${economy.action?'disabled':''}>Attack <span class="tag action">Action</span></button>
      <button class="opt" data-detail="spell" ${economy.action?'disabled':''}>Cast a Spell <span class="tag action">Action*</span></button>
      <button class="opt" data-detail="dash" ${economy.action?'disabled':''}>Dash / Disengage / Dodge <span class="tag action">Action</span></button>
      <button class="opt" data-detail="help" ${economy.action?'disabled':''}>Help / Search / Hide <span class="tag action">Action</span></button>
      <button class="opt" data-detail="item" ${economy.action?'disabled':''}>Use an Item <span class="tag action">Action*</span></button>
      <button class="opt" data-detail="bonus" ${economy.bonus?'disabled':''}>Bonus Action Feature <span class="tag bonus">Bonus</span></button>
      <button class="opt" data-detail="move" ${economy.move?'disabled':''}>Move <span class="tag move">Move</span></button>
      <button class="opt" data-detail="reaction" ${economy.reaction?'disabled':''}>What's a Reaction? <span class="tag reaction">Reaction</span></button>
    </div>
    <p style="margin-top:14px; font-size:0.78rem;">* Only takes an Action if the spell/item says so.</p>
  `;
  document.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
    currentDetail = btn.dataset.detail; currentView = 'detail'; render();
  }));
}

function renderDetail(){
  const panel = document.getElementById('mainPanel');
  const d = DETAILS[currentDetail];
  const usesLabel = { action:'Action', bonus:'Bonus Action', reaction:'Reaction', move:'Movement' }[d.uses];
  const alreadyUsed = economy[d.uses];
  panel.innerHTML = `
    <div class="bl"></div><div class="br"></div>
    <h2>${d.title}</h2>
    <p>${d.body}</p>
    <ul class="examples">${d.examples.map(e => `<li>${e}</li>`).join('')}</ul>
    <div class="back-row">
      <button class="plain" id="backBtn">← Back</button>
      <button class="primary" id="markUsedBtn" ${alreadyUsed?'disabled':''}>${alreadyUsed?'Already Used':`Mark ${usesLabel} Used`}</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => { currentView = MAIN_MENU; render(); });
  document.getElementById('markUsedBtn').addEventListener('click', () => { economy[d.uses] = true; currentView = MAIN_MENU; render(); });
}

function render(){
  renderStatusBar();
  if(currentView === MAIN_MENU) renderMenu(); else renderDetail();
}
function escapeHtml(str){ const div=document.createElement('div'); div.textContent=str; return div.innerHTML; }

document.getElementById('newTurnBtn').addEventListener('click', () => {
  economy = { action:false, bonus:false, reaction:false, move:false };
  currentView = MAIN_MENU; render();
});
document.getElementById('pName').addEventListener('input', () => { if(currentView === MAIN_MENU) renderMenu(); });

render();
</script>
</body>
</html>
