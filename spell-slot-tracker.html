<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPELL SLOT // TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --panel:#141412;
    --white:#F2F1EC; --gray:#8A8A82; --gray-line:#38372F;
    --orange:#FF8F5E; --red:#FF5C5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg);
    background-image:repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color:var(--white); font-family:'Archivo', sans-serif; min-height:100vh; padding:24px 14px 60px;
  }
  .wrap{max-width:820px; margin:0 auto;}
  header{padding:14px 0; margin-bottom:6px; border-bottom:3px solid var(--white);}
  h1{font-family:'Archivo Black', sans-serif; font-size:1.3rem; letter-spacing:0.02em; margin:0 0 6px; text-transform:uppercase;}
  .subtitle{font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--gray); margin:0;}
  .hazard-bar{height:6px; background:repeating-linear-gradient(-45deg, var(--orange) 0 10px, var(--bg) 10px 20px); margin-bottom:20px;}

  .toolbar{display:flex; gap:2px; margin-bottom:20px; flex-wrap:wrap;}
  button{
    font-family:'Archivo', sans-serif; font-weight:700; font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em;
    background:var(--panel); color:var(--white); border:1px solid var(--gray-line); padding:10px 16px; cursor:pointer;
  }
  button:hover{border-color:var(--orange); color:var(--orange);}
  button.primary{background:var(--orange); color:var(--bg); border-color:var(--orange);}
  button.primary:hover{background:var(--white); color:var(--bg);}
  button.small{padding:3px 8px; font-size:0.65rem;}

  .grid{display:flex; flex-direction:column; gap:14px; margin-bottom:20px;}
  .card{position:relative; background:var(--panel); border:1px solid var(--gray-line); padding:16px 18px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .card-name{
    font-family:'Archivo Black', sans-serif; font-size:1rem; text-transform:uppercase; background:transparent; border:none;
    color:var(--white); flex:1; min-width:120px; border-bottom:1px solid transparent;
  }
  .card-name:focus{outline:none; border-bottom:1px solid var(--orange);}
  .head-actions{display:flex; gap:6px; align-items:center;}
  .remove-x{background:none; border:none; color:var(--gray); font-size:1.1rem; cursor:pointer;}
  .remove-x:hover{color:var(--red);}

  .levels{display:flex; flex-direction:column; gap:10px;}
  .level-row{display:flex; align-items:center; gap:12px;}
  .level-label{font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:var(--gray); width:56px; flex-shrink:0; text-transform:uppercase;}
  .pips{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .pip{
    width:26px; height:26px; border:1px solid var(--gray-line); background:var(--bg); cursor:pointer;
    transition:background .1s, border-color .1s; flex-shrink:0;
  }
  .pip:hover{border-color:var(--orange);}
  .pip.filled{background:var(--orange); border-color:var(--orange);}
  .max-edit{display:flex; align-items:center; gap:4px; font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--gray); flex-shrink:0;}
  .max-edit button{width:20px; height:20px; padding:0; display:flex; align-items:center; justify-content:center; font-size:0.85rem; line-height:1;}
  .max-edit .max-count{width:14px; text-align:center;}

  .empty{text-align:center; padding:44px 20px; color:var(--gray); font-family:'JetBrains Mono', monospace; font-size:0.85rem; border:1px dashed var(--gray-line); margin-bottom:20px;}

  .legend-note{font-family:'JetBrains Mono', monospace; font-size:0.72rem; color:var(--gray-line); margin-top:8px;}

  @media (max-width:480px){
    .level-label{width:44px; font-size:0.68rem;}
    .pip{width:22px; height:22px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spell Slot // Tracker</h1>
    <p class="subtitle">Tap a pip to spend/restore it. Long Rest refills everyone.</p>
  </header>
  <div class="hazard-bar"></div>

  <div class="toolbar">
    <button class="primary" id="addCasterBtn">+ Add Caster</button>
    <button id="longRestBtn">Long Rest / Refill All</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">NO CASTERS TRACKED — ADD ONE ABOVE</div>
</div>

<script>
let casters = [];
let nextId = 1;
const LEVELS = [1,2,3,4,5,6,7,8,9];

function addCaster(name = 'New Caster'){
  const maxSlots = {}, used = {};
  LEVELS.forEach(l => { maxSlots[l]=0; used[l]=0; });
  maxSlots[1]=4; maxSlots[2]=3; maxSlots[3]=2;
  casters.push({ id: nextId++, name, maxSlots, used });
  render();
}

function render(){
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('emptyMsg');
  if(casters.length === 0){ grid.innerHTML=''; emptyMsg.style.display='block'; return; }
  emptyMsg.style.display='none';

  grid.innerHTML = casters.map(c => {
    const levelRows = LEVELS.map(l => {
      const pips = Array.from({length: c.maxSlots[l]}, (_, i) => {
        const filled = i < (c.maxSlots[l] - c.used[l]);
        return `<div class="pip ${filled?'filled':''}" data-action="toggle" data-id="${c.id}" data-level="${l}" data-index="${i}"></div>`;
      }).join('');
      return `
      <div class="level-row">
        <span class="level-label">LVL ${l}</span>
        <div class="pips">${pips}</div>
        <div class="max-edit">
          <button data-action="maxdown" data-id="${c.id}" data-level="${l}">−</button>
          <span class="max-count">${c.maxSlots[l]}</span>
          <button data-action="maxup" data-id="${c.id}" data-level="${l}">+</button>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="card" data-id="${c.id}">
      <div class="card-head">
        <input class="card-name" value="${escapeHtml(c.name)}" data-field="name" data-id="${c.id}">
        <div class="head-actions">
          <button class="small" data-action="rest" data-id="${c.id}">Refill</button>
          <button class="remove-x" data-action="remove" data-id="${c.id}">✕</button>
        </div>
      </div>
      <div class="levels">${levelRows}</div>
      <div class="legend-note">Tap a filled pip to spend it, an empty one to restore it.</div>
    </div>`;
  }).join('');

  attachListeners();
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

function attachListeners(){
  document.querySelectorAll('[data-action="toggle"]').forEach(pip => pip.addEventListener('click', () => {
    const id = +pip.dataset.id, level = +pip.dataset.level, index = +pip.dataset.index;
    const c = casters.find(x => x.id === id);
    const filledCount = c.maxSlots[level] - c.used[level];
    const isFilled = index < filledCount;
    c.used[level] = isFilled ? Math.min(c.maxSlots[level], c.used[level]+1) : Math.max(0, c.used[level]-1);
    render();
  }));
  document.querySelectorAll('[data-action="maxup"]').forEach(btn => btn.addEventListener('click', () => {
    const id = +btn.dataset.id, level = +btn.dataset.level;
    const c = casters.find(x => x.id === id);
    c.maxSlots[level] = Math.min(20, c.maxSlots[level]+1); render();
  }));
  document.querySelectorAll('[data-action="maxdown"]').forEach(btn => btn.addEventListener('click', () => {
    const id = +btn.dataset.id, level = +btn.dataset.level;
    const c = casters.find(x => x.id === id);
    if(c.maxSlots[level] > 0){ c.maxSlots[level]--; c.used[level] = Math.min(c.used[level], c.maxSlots[level]); }
    render();
  }));
  document.querySelectorAll('[data-action="rest"]').forEach(btn => btn.addEventListener('click', () => {
    const c = casters.find(x => x.id === +btn.dataset.id);
    LEVELS.forEach(l => c.used[l] = 0); render();
  }));
  document.querySelectorAll('[data-action="remove"]').forEach(btn => btn.addEventListener('click', () => {
    casters = casters.filter(x => x.id !== +btn.dataset.id); render();
  }));
  document.querySelectorAll('[data-field="name"]').forEach(input => input.addEventListener('input', () => {
    casters.find(x => x.id === +input.dataset.id).name = input.value;
  }));
}

document.getElementById('addCasterBtn').addEventListener('click', () => addCaster(`Caster ${casters.length+1}`));
document.getElementById('longRestBtn').addEventListener('click', () => {
  casters.forEach(c => LEVELS.forEach(l => c.used[l] = 0));
  render();
});

addCaster('Player 1');
</script>
</body>
</html>
