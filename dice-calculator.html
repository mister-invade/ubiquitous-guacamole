<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DICE // CALCULATOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A; --panel:#141412;
    --white:#F2F1EC; --gray:#8A8A82; --gray-line:#38372F;
    --orange:#FF8F5E; --red:#FF5C5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg);
    background-image:repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    color:var(--white); font-family:'Archivo', sans-serif; min-height:100vh; padding:24px 14px 60px;
  }
  .wrap{max-width:540px; margin:0 auto;}
  header{padding:14px 0; margin-bottom:6px; border-bottom:3px solid var(--white);}
  h1{font-family:'Archivo Black', sans-serif; font-size:1.25rem; letter-spacing:0.02em; margin:0 0 6px; text-transform:uppercase;}
  .subtitle{font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--gray); margin:0;}
  .hazard-bar{height:6px; background:repeating-linear-gradient(-45deg, var(--orange) 0 10px, var(--bg) 10px 20px); margin-bottom:20px;}

  .bracket-panel{position:relative; background:var(--panel); border:1px solid var(--gray-line); padding:20px; margin-bottom:18px;}
  .bracket-panel .bl, .bracket-panel .br{content:''; position:absolute; width:14px; height:14px;}
  .bracket-panel .bl{ bottom:-1px; left:-1px; border-bottom:2px solid var(--gray); border-left:2px solid var(--gray); }
  .bracket-panel .br{ bottom:-1px; right:-1px; border-bottom:2px solid var(--gray); border-right:2px solid var(--gray); }
  .bracket-panel h2{font-family:'Archivo Black', sans-serif; font-size:0.95rem; margin:0 0 14px; text-transform:uppercase;}

  label{font-family:'JetBrains Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--gray); display:block; margin-bottom:6px;}
  input{width:100%; background:var(--bg); border:1px solid var(--gray-line); color:var(--white); padding:10px 12px; font-family:'JetBrains Mono', monospace; font-size:1rem;}
  input:focus{outline:none; border-color:var(--orange);}
  .row{display:flex; gap:10px; align-items:flex-end; margin-bottom:6px;}
  .row > div{flex:1;}
  button{
    font-family:'Archivo', sans-serif; font-weight:700; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.03em;
    background:var(--orange); color:var(--bg); border:1px solid var(--orange); padding:10px 18px; cursor:pointer;
  }
  button:hover{background:var(--white); border-color:var(--white);}

  .result{margin-top:16px; padding:14px; background:var(--bg); border:1px solid var(--gray-line);}
  .result .big{font-family:'JetBrains Mono', monospace; font-size:1.8rem; color:var(--orange); font-weight:700;}
  .result .breakdown{font-family:'JetBrains Mono', monospace; font-size:0.82rem; color:var(--gray); margin-top:6px;}
  .hint{font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:var(--gray-line); margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dice // Calculator</h1>
    <p class="subtitle">Ability modifier lookup + dice notation roller.</p>
  </header>
  <div class="hazard-bar"></div>

  <div class="bracket-panel">
    <div class="bl"></div><div class="br"></div>
    <h2>Ability Score → Modifier</h2>
    <label for="scoreInput">Ability Score</label>
    <input type="number" id="scoreInput" placeholder="e.g. 16">
    <div class="result" id="modResult" style="display:none;">
      <div class="big" id="modBig"></div>
      <div class="breakdown" id="modBreakdown"></div>
    </div>
    <p class="hint">MOD = (SCORE − 10) ÷ 2, ROUNDED DOWN</p>
  </div>

  <div class="bracket-panel">
    <div class="bl"></div><div class="br"></div>
    <h2>Roll Dice Notation</h2>
    <label for="diceInput">Notation (e.g. 2d6+3)</label>
    <div class="row">
      <div><input type="text" id="diceInput" placeholder="2d6+3"></div>
      <button id="rollBtn">Roll</button>
    </div>
    <div class="result" id="diceResult" style="display:none;">
      <div class="big" id="diceBig"></div>
      <div class="breakdown" id="diceBreakdown"></div>
    </div>
    <p class="hint">FORMAT: [COUNT]d[SIDES][+/- MOD] — E.G. 3D8+2</p>
  </div>
</div>

<script>
document.getElementById('scoreInput').addEventListener('input', (e) => {
  const val = parseInt(e.target.value);
  const resultBox = document.getElementById('modResult');
  if(isNaN(val)){ resultBox.style.display = 'none'; return; }
  const mod = Math.floor((val - 10) / 2);
  const sign = mod >= 0 ? '+' : '';
  resultBox.style.display = 'block';
  document.getElementById('modBig').textContent = `${sign}${mod}`;
  document.getElementById('modBreakdown').textContent = `(${val} − 10) ÷ 2 = ${sign}${mod}`;
});

function rollDice(notation){
  const match = notation.trim().toLowerCase().match(/^(\d+)d(\d+)\s*([+-]\s*\d+)?$/);
  if(!match) return null;
  const count = parseInt(match[1]), sides = parseInt(match[2]);
  const mod = match[3] ? parseInt(match[3].replace(/\s/g,'')) : 0;
  if(count < 1 || count > 100 || sides < 2) return null;
  const rolls = [];
  for(let i=0;i<count;i++) rolls.push(Math.floor(Math.random()*sides)+1);
  return { rolls, mod, total: rolls.reduce((a,b)=>a+b,0)+mod };
}

document.getElementById('rollBtn').addEventListener('click', () => {
  const notation = document.getElementById('diceInput').value;
  const resultBox = document.getElementById('diceResult');
  const result = rollDice(notation);
  resultBox.style.display = 'block';
  if(!result){
    document.getElementById('diceBig').textContent = '—';
    document.getElementById('diceBreakdown').textContent = 'INVALID NOTATION — TRY 2D6+3';
    return;
  }
  document.getElementById('diceBig').textContent = result.total;
  const modText = result.mod !== 0 ? ` ${result.mod>0?'+':'−'} ${Math.abs(result.mod)}` : '';
  document.getElementById('diceBreakdown').textContent = `ROLLED: [${result.rolls.join(', ')}]${modText}`;
});
document.getElementById('diceInput').addEventListener('keydown', (e) => { if(e.key==='Enter') document.getElementById('rollBtn').click(); });
</script>
</body>
</html>
